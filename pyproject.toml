[project]
name = "homework-deployer"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.45",
    "py-cove",
    "pydantic-settings>=2.14.2",
    "pygrader",
    "setuptools>=80.9.0",
]

[project.scripts]
homework-deployer = "homework_deployer:main"

[build-system]
requires = [
  "setuptools >= 80.9.0",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "complexipy>=4.2.0",
    "coverage>=7.10.7",
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "pylint>=3.3.8",
    "ruff>=0.15.20",
]

[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 10
quiet = false
sort = "asc"
details = "low"

[tool.complexipy.output]
json = true

[tool.uv.sources]
py-cove = { git = "https://github.com/lyubolp/py-cove", rev = "v1.4.0" }
pygrader = { git = "https://github.com/fmipython/pygrader", rev = "v1.13.0" }
